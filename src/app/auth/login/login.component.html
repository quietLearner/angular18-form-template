<form #form="ngForm" (ngSubmit)="onSubmit(form)">
  <h2>Login</h2>

  <div class="control-row">
    <div class="control no-margin">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        name="email"
        ngModel
        required
        email
        #emailCtl="ngModel"
      />
    </div>

    <div class="control no-margin">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        ngModel
        required
        minlength="3"
        #passwordCtl="ngModel"
      />
    </div>

    <button class="button" [disabled]="form.invalid">Login</button>
  </div>

  <!-- @if (form.invalid && form.touched) { -->
  <!-- @if ((form.invalid && emailCtl.touched) || passwordCtl.touched) {
    <p class="control-error">
      Invalid values detected. Please check your inputs
    </p>
  } -->

  @if (emailCtl.touched && emailCtl.dirty && emailCtl.invalid) {
    <p class="control-error">Invalid email entered</p>
  }

  @if (passwordCtl.touched && passwordCtl.dirty && passwordCtl.invalid) {
    <p class="control-error">Invalid password entered</p>
  }
</form>
